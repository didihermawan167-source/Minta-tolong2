
name: Uji APK 28 - Pemeriksaan Lengkap

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan laporan
        run: mkdir -p test-results

      
      - name: Unduh APK 28
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p test-results
          RUN_IDS=$(gh run list \
            --workflow build-apk.yml \
            --branch main \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')

          for ID in $RUN_IDS; do
            rm -rf artifact
            if gh run download "$ID" \
              --name minta-tolong-apk \
              --dir artifact; then
              APK=$(find artifact -type f -name '*.apk' -print -quit)
              if [ -n "$APK" ]; then
                cp "$APK" test-results/minta-tolong.apk
                echo "APK berhasil diunduh dari run $ID" \
                  > test-results/download.txt
                break
              fi
            fi
          done

          test -s test-results/minta-tolong.apk


      - name: Uji APK di emulator Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            R="$PWD/test-results"
            APK="$R/minta-tolong.apk"
            mkdir -p "$R"

            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "ANDROID_HOME=$ANDROID_HOME" > "$R/sdk-info.txt"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$R/sdk-info.txt"

            AAPT=$(find "$SDK/build-tools" -type f \
              -name aapt -print -quit 2>/dev/null)
            APKSIGNER=$(find "$SDK/build-tools" -type f \
              -name apksigner -print -quit 2>/dev/null)

            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" > "$R/apk-info.txt" 2>&1
              "$AAPT" dump permissions "$APK" > "$R/permissions.txt" 2>&1
            else
              echo "aapt tidak ditemukan di $SDK/build-tools" > "$R/apk-info.txt"
              echo "GAGAL: aapt tidak ditemukan" > "$R/permissions.txt"
            fi

            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose --print-certs "$APK" \
                > "$R/signature.txt" 2>&1
              echo "Exit code: $?" >> "$R/signature.txt"
            else
              echo "apksigner tidak ditemukan" > "$R/signature.txt"
            fi

            PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              "$R/apk-info.txt" | head -n 1)
            echo "Package: $PACKAGE" > "$R/package.txt"

            adb install -r "$APK" > "$R/install.txt" 2>&1
            INSTALL_CODE=$?
            cat "$R/install.txt"

            if [ "$INSTALL_CODE" -eq 0 ] && [ -n "$PACKAGE" ]; then
              adb shell monkey -p "$PACKAGE" 1 > "$R/launch.txt" 2>&1
              sleep 20
              adb shell pidof "$PACKAGE" > "$R/app-pid.txt" 2>&1
              adb shell screencap -p /sdcard/test.png
              adb pull /sdcard/test.png "$R/screenshot.png" \
                > "$R/screenshot-copy.txt" 2>&1
            else
              echo "Aplikasi tidak berhasil dipasang" > "$R/launch.txt"
            fi

            adb logcat -d -t 5000 > "$R/logcat.txt" 2>&1

            if [ "$INSTALL_CODE" -ne 0 ]; then
              echo "GAGAL: APK tidak dapat dipasang"
              exit 1
            fi

            if [ ! -s "$R/app-pid.txt" ]; then
              echo "GAGAL: proses aplikasi tidak terdeteksi"
              exit 1
            fi

            echo "LULUS: APK terpasang dan proses terdeteksi"

      - name: Simpan laporan walau pengujian gagal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-uji-apk-28
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
          
