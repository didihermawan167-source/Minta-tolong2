name: Tim QC AI - Uji APK Otomatis
# Use the base Android image; this app does not require Google Play services.
# A push to this workflow file reruns QC against the latest successful APK build.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-apk-28.yml'
      - '.github/scripts/qc-emulator.sh'
      - '.github/scripts/qc-auth-ui.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-apk-28.yml'
      - '.github/scripts/qc-emulator.sh'
  workflow_run:
    workflows: ["Build APK Minta Tolong"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Emulator QC is resource-heavy. Queue runs globally so several builds
# do not start competing Android emulators at the same time.
concurrency:
  group: minta-tolong-android-qc
  # Never cancel a live Android emulator boot when a follow-up QC commit lands.
  # Emulator startup is expensive; queue newer commits until the current run
  # finishes so its diagnostics remain complete and comparable.
  cancel-in-progress: false

jobs:
  test-apk:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Bound the whole job; emulator boot itself has a 15-minute timeout.
    timeout-minutes: 30
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4
      - name: Tentukan build APK sumber
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Build APK sumber: $RUN_ID"
      - name: Unduh APK dari proses build yang tepat
        uses: actions/download-artifact@v4
        with:
          name: minta-tolong-apk
          path: test-results/input
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Periksa APK dan siapkan laporan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          APK="$(find test-results/input -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" test-results/minta-tolong.apk
          test -s test-results/minta-tolong.apk
          unzip -tq test-results/minta-tolong.apk
          sha256sum test-results/minta-tolong.apk | tee test-results/sha256.txt
          echo "APK berhasil diunduh dan arsip ZIP valid." | tee test-results/precheck.txt
      - name: Tim QC menguji instalasi dan pembukaan aplikasi
        id: emulator-qc
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          # A/B experiment: API 35 fixed; explicitly use SwiftShader software rendering to avoid unstable auto GPU selection on CPU-only Linux runners.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          disable-animations: true
          script: |
            sh "$GITHUB_WORKSPACE/.github/scripts/qc-emulator.sh"
            sh "$GITHUB_WORKSPACE/.github/scripts/qc-auth-ui.sh"
      - name: Ambil diagnostik jika emulator gagal sebelum skrip QC
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/runner-diagnostics
          D=test-results/runner-diagnostics
          {
            echo "job_status=${{ job.status }}"
            echo "emulator_step_outcome=${{ steps.emulator-qc.outcome }}"
            date -u
            uname -a
            echo "--- memory ---"
            free -h || true
            echo "--- disk ---"
            df -h || true
            echo "--- load ---"
            cat /proc/loadavg || true
            echo "--- emulator version ---"
            emulator -version 2>&1 || true
            echo "--- acceleration ---"
            emulator -accel-check 2>&1 || true
            echo "--- adb version ---"
            adb version 2>&1 || true
            echo "--- adb devices ---"
            adb devices -l 2>&1 || true
            echo "--- emulator/adb processes ---"
            ps -eo pid,ppid,stat,%cpu,%mem,etime,cmd | grep -E '[e]mulator|[q]emu|[a]db' || true
          } > "$D/runner-state.txt" 2>&1
          if adb get-state >/dev/null 2>&1; then
            adb shell getprop > "$D/device-properties.txt" 2>&1 || true
            adb shell getprop sys.boot_completed > "$D/sys-boot-completed.txt" 2>&1 || true
            adb logcat -b all -d -v threadtime > "$D/logcat-after-emulator-step.txt" 2>&1 || true
            adb shell dumpsys dropbox --print system_app_anr > "$D/dropbox-system-anr.txt" 2>&1 || true
            adb shell dumpsys dropbox --print data_app_anr > "$D/dropbox-app-anr.txt" 2>&1 || true
          fi
          if [ ! -s test-results/QC-RESULT.txt ]; then
            printf '%s\\n' "GAGAL QC INFRASTRUKTUR: langkah emulator berakhir dengan outcome ${{ steps.emulator-qc.outcome }} sebelum skrip QC menghasilkan laporan. Periksa runner-diagnostics." > test-results/QC-RESULT.txt
          fi
          find "$HOME/.android" "$RUNNER_TEMP" -maxdepth 4 -type f \( -iname '*emulator*.log' -o -iname '*qemu*.log' -o -iname '*adb*.log' \) -size -20M -print 2>/dev/null | head -30 > "$D/host-log-index.txt" || true
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            cp "$file" "$D/$(basename "$file")" 2>/dev/null || true
          done < "$D/host-log-index.txt"
      - name: Simpan laporan QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-qc-apk
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Ringkasan laporan
        if: always()
        run: |
          {
            echo "## Laporan Tim QC AI"
            echo "- Build sumber: ${{ github.event.workflow_run.id || github.run_id }}"
            echo "- Hasil job QC: ${{ job.status }}"
            if [ -f test-results/QC-RESULT.txt ]; then cat test-results/QC-RESULT.txt; fi
            if [ -f test-results/precheck.txt ]; then cat test-results/precheck.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
