name: Tim QC AI - Uji APK Otomatis
# Use the base Android image; this app does not require Google Play services.
# A push to this workflow file reruns QC against the latest successful APK build.

on:
  workflow_dispatch:
  push:
    branches: [main, fix/auth-bootstrap-timeout]
    paths:
      - '.github/workflows/test-apk-28.yml'
      - '.github/scripts/qc-emulator.sh'
  workflow_run:
    workflows: ["Build APK Minta Tolong"]
    types: [completed]
    branches: [main, fix/auth-bootstrap-timeout]

permissions:
  actions: read
  contents: read

# Emulator QC is resource-heavy. Queue runs globally so several builds
# do not start competing Android emulators at the same time.
concurrency:
  group: minta-tolong-android-qc
  cancel-in-progress: false

jobs:
  test-apk:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4
      - name: Tentukan build APK sumber
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Build APK sumber: $RUN_ID"
      - name: Unduh APK dari proses build yang tepat
        uses: actions/download-artifact@v4
        with:
          name: minta-tolong-apk-update
          path: test-results/input
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Periksa APK dan siapkan laporan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          APK="$(find test-results/input -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" test-results/minta-tolong.apk
          test -s test-results/minta-tolong.apk
          unzip -tq test-results/minta-tolong.apk
          sha256sum test-results/minta-tolong.apk | tee test-results/sha256.txt
          echo "APK berhasil diunduh dan arsip ZIP valid." | tee test-results/precheck.txt
      - name: Tim QC menguji instalasi dan pembukaan aplikasi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -memory 3072 -cores 2
          disable-animations: true
          script: |
            sh "$GITHUB_WORKSPACE/.github/scripts/qc-emulator.sh"
      - name: Simpan laporan QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-qc-apk
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Simpan diagnostik teks terpisah
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-qc-diagnostik-teks
          path: |
            test-results/QC-RESULT.txt
            test-results/precheck.txt
            test-results/package.txt
            test-results/launcher-activity.txt
            test-results/install.txt
            test-results/launch.txt
            test-results/window.xml
            test-results/activities.txt
            test-results/windows.txt
            test-results/activity-processes.txt
            test-results/app-pid.txt
            test-results/cpuinfo.txt
            test-results/meminfo.txt
            test-results/dropbox-app-anr.txt
            test-results/dropbox-system-anr.txt
            test-results/logcat-all.txt
            test-results/anr-evidence.txt
            test-results/fatal-errors.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Ringkasan laporan
        if: always()
        run: |
          {
            echo "## Laporan Tim QC AI"
            echo "- Build sumber: ${{ github.event.workflow_run.id || github.run_id }}"
            echo "- Hasil job QC: ${{ job.status }}"
            if [ -f test-results/QC-RESULT.txt ]; then cat test-results/QC-RESULT.txt; fi
            if [ -f test-results/precheck.txt ]; then cat test-results/precheck.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
