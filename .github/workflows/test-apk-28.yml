name: Tim QC AI - Uji APK Otomatis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-apk-28.yml'
  workflow_run:
    workflows: ["Build APK Minta Tolong"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Emulator QC is resource-heavy. Queue runs globally so several builds
# do not start competing Android emulators at the same time.
concurrency:
  group: minta-tolong-android-qc
  cancel-in-progress: true

jobs:
  test-apk:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4
      - name: Tentukan build APK sumber
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Build APK sumber: $RUN_ID"
      - name: Unduh APK dari proses build yang tepat
        uses: actions/download-artifact@v4
        with:
          name: minta-tolong-apk
          path: test-results/input
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Periksa APK dan siapkan laporan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          APK="$(find test-results/input -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" test-results/minta-tolong.apk
          test -s test-results/minta-tolong.apk
          unzip -tq test-results/minta-tolong.apk
          sha256sum test-results/minta-tolong.apk | tee test-results/sha256.txt
          echo "APK berhasil diunduh dan arsip ZIP valid." | tee test-results/precheck.txt
      - name: Tim QC menguji instalasi dan pembukaan aplikasi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # This action executes its script with /usr/bin/sh, not Bash.
            set -eu
            R="$GITHUB_WORKSPACE/test-results"
            APK="$R/minta-tolong.apk"
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "Menunggu emulator siap..."
            adb wait-for-device
            BOOTED=""
            ATTEMPT=0
            while [ "$ATTEMPT" -lt 150 ]; do
              BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$BOOTED" = "1" ]; then break; fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done
            if [ "$BOOTED" != "1" ]; then
              echo "Emulator gagal menyelesaikan proses boot dalam 300 detik."
              adb devices -l || true
              exit 1
            fi
            echo "Emulator siap."
            AAPT="$(find "$SDK/build-tools" -type f -name aapt -print -quit 2>/dev/null || true)"
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" > "$R/apk-info.txt"
              "$AAPT" dump permissions "$APK" > "$R/permissions.txt"
              PACKAGE="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$R/apk-info.txt" | head -n 1)"
            else
              PACKAGE="$(apkanalyzer manifest application-id "$APK")"
              echo "aapt tidak tersedia; package diperiksa dengan apkanalyzer." > "$R/apk-info.txt"
            fi
            test -n "$PACKAGE"
            echo "$PACKAGE" | tee "$R/package.txt"
            adb install -r "$APK" 2>&1 | tee "$R/install.txt"
            adb shell monkey -p "$PACKAGE" 1 2>&1 | tee "$R/launch.txt"
            sleep 20
            adb shell pidof "$PACKAGE" | tee "$R/app-pid.txt"
            test -s "$R/app-pid.txt"
            adb shell screencap -p /sdcard/qc-screen.png
            adb pull /sdcard/qc-screen.png "$R/screenshot.png"
            adb logcat -d -t 5000 > "$R/logcat.txt"
            echo "LULUS: APK dapat dipasang, dibuka, dan proses aplikasi terdeteksi." | tee "$R/QC-RESULT.txt"
      - name: Simpan laporan QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-qc-apk
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Ringkasan laporan
        if: always()
        run: |
          {
            echo "## Laporan Tim QC AI"
            echo "- Build sumber: ${{ github.event.workflow_run.id || github.run_id }}"
            echo "- Hasil job QC: ${{ job.status }}"
            if [ -f test-results/QC-RESULT.txt ]; then cat test-results/QC-RESULT.txt; fi
            if [ -f test-results/precheck.txt ]; then cat test-results/precheck.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
