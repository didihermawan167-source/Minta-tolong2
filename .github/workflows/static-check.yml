name: Pemeriksaan Kode Tanpa Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/static-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/static-check.yml'

permissions:
  contents: write

concurrency:
  group: static-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle-check:
    name: Periksa dependensi dan bundel Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sinkronkan lockfile dengan package.json
        run: npm install --no-audit --no-fund

      - name: Simpan perbaikan lockfile
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync npm lockfile with package.json"
            git push
          fi

      - name: Pasang dependensi terkunci
        run: npm ci

      - name: Periksa kompatibilitas Expo
        run: npx expo install --check

      - name: Uji bundel Android tanpa EAS Build
        run: npx expo export --platform android

      - name: Catat batas pengujian
        run: |
          echo "Pemeriksaan dependensi dan bundel JavaScript Android selesai."
          echo "Workflow ini TIDAK membangun APK dan TIDAK memakai kuota EAS Build."
