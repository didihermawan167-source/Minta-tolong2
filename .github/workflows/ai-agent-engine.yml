name: AI Center - Mesin Agen dan Koordinator

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-center-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent-manager:
    if: contains(github.event.issue.labels.*.name, 'ai-task') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Jalankan mesin agen AI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python3 .github/scripts/ai_agent_manager.py
