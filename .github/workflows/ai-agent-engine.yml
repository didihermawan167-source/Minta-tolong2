name: AI Center - Mesin Agen dan Koordinator

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Nomor tiket AI yang akan diproses manual"
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-center-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  agent-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4
      - name: Periksa sintaks mesin agen
        run: python3 -m py_compile .github/scripts/ai_agent_manager.py
      - name: Jalankan mesin agen AI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python3 .github/scripts/ai_agent_manager.py
