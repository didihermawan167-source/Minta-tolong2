name: Build APK Minta Tolong

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa kecocokan dependensi Expo
        run: npx expo install --check

      - name: Pasang EAS CLI
        run: npm install -g eas-cli

      - name: Bangun APK Android
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Unduh APK
        run: |
          URL=$(node -e "const r=require('./build-result.json'); console.log(Array.isArray(r) ? r[0].artifacts.buildUrl : r.artifacts.buildUrl)")
          curl -fL "$URL" -o minta-tolong.apk

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-apk
          path: minta-tolong.apk
          if-no-files-found: error
          retention-days: 7
