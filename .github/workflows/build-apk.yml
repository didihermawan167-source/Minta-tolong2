name: Build APK Minta Tolong

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'assets/**'
      - 'components/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi terkunci
        run: npm ci

      - name: Periksa kompatibilitas Expo
        run: npx expo install --check

      - name: Pastikan token EAS tersedia
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN belum tersedia. Build dihentikan agar tidak menghasilkan APK debug yang tidak bisa memperbarui aplikasi lama."
            exit 1
          fi

      - name: Pasang EAS CLI
        run: npm install --global eas-cli

      - name: Bangun APK bertanda tangan EAS yang sama
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Unduh APK hasil build
        run: |
          set -euo pipefail
          URL=$(node -e "const r=require('./build-result.json'); const b=Array.isArray(r)?r[0]:r; console.log(b.artifacts.buildUrl)")
          test -n "$URL"
          curl -fL "$URL" -o minta-tolong.apk
          test -s minta-tolong.apk

      - name: Periksa APK dan identitas tanda tangan
        run: |
          set -euo pipefail
          unzip -tq minta-tolong.apk
          unzip -Z1 minta-tolong.apk | grep -qx 'AndroidManifest.xml'
          unzip -Z1 minta-tolong.apk | grep -Eq '^classes([0-9]+)?\.dex$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs minta-tolong.apk
          sha256sum minta-tolong.apk | tee apk-sha256.txt
          du -h minta-tolong.apk

      - name: Simpan APK instalasi
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-apk
          path: |
            minta-tolong.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Buat ZIP cadangan source proyek
        run: git archive --format=zip --output=minta-tolong-source.zip HEAD

      - name: Simpan ZIP source
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-source
          path: minta-tolong-source.zip
          if-no-files-found: error
          retention-days: 14
