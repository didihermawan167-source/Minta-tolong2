name: Build APK Minta Tolong

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'assets/**'
      - 'components/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/test-apk-28.yml'
  push:
    branches:
      - main
      - fix/auth-bootstrap-timeout
    paths:
      - 'app/**'
      - 'lib/**'
      - 'assets/**'
      - 'components/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Siapkan Java untuk Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang dependensi terkunci
        run: npm ci

      - name: Periksa kompatibilitas Expo
        run: npx expo install --check

      - name: Pastikan identitas APK tetap kompatibel untuk update
        run: |
          npx expo config --type public --json > expo-config.json
          node -e "const c=require('./expo-config.json'); if(c.android?.package !== 'com.mintatolong.test') { console.error('Package harus tetap com.mintatolong.test:', c.android?.package); process.exit(1); } console.log('Nama:', c.name, '| Package:', c.android.package);"

      - name: Pasang EAS CLI
        run: npm install --global eas-cli

      - name: Bangun APK secara lokal tanpa kuota cloud EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/eas-local-artifacts
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN belum tersedia; build lokal EAS memerlukan autentikasi untuk mengambil kredensial proyek."
            exit 1
          fi
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          eas build --platform android --profile preview --local --non-interactive --json > eas-local-build.json
          APK="$(find "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" -maxdepth 2 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Build lokal selesai tanpa menghasilkan file APK."
            find "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" -maxdepth 3 -type f -print || true
            exit 1
          fi
          cp "$APK" minta-tolong.apk

      - name: Periksa APK, package, dan tanda tangan
        run: |
          set -euo pipefail
          test -s minta-tolong.apk
          unzip -tq minta-tolong.apk
          unzip -Z1 minta-tolong.apk | grep -qx 'AndroidManifest.xml'
          unzip -Z1 minta-tolong.apk | grep -Eq '^classes([0-9]+)?\.dex$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt -print -quit)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print -quit)
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging minta-tolong.apk | tee apk-info.txt
          grep -q "^package: name='com.mintatolong.test'" apk-info.txt
          "$APKSIGNER" verify --verbose --print-certs minta-tolong.apk
          sha256sum minta-tolong.apk | tee apk-sha256.txt
          du -h minta-tolong.apk

      - name: Simpan APK update untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-apk-update
          path: |
            minta-tolong.apk
            apk-info.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Buat ZIP cadangan source proyek
        run: git archive --format=zip --output=minta-tolong-source.zip HEAD

      - name: Simpan ZIP source
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-source
          path: minta-tolong-source.zip
          if-no-files-found: error
          retention-days: 14
