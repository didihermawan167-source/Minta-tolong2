name: Build APK Minta Tolong

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm ci

      - name: Pasang EAS CLI
        run: npm install -g eas-cli

      - name: Bangun APK Android
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Unduh APK dari Expo
        run: eas build:download --platform android --latest --path ./minta-tolong.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-apk
          path: minta-tolong.apk
          if-no-files-found: error
          retention-days: 7
          
