name: Build APK Minta Tolong - APK Terpisah

on:
  workflow_dispatch:
  push:
    branches:
      - apk-terpisah-hp-test
    paths:
      - 'app/**'
      - 'lib/**'
      - 'assets/**'
      - 'components/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dan selaraskan dependensi
        run: |
          npm install
          npx expo install --fix
          npx expo install --check

      - name: Periksa kode aplikasi
        run: npx expo export --platform android

      - name: Pastikan identitas APK terpisah
        run: |
          node -e "const c=require('./app.json').expo; if(c.android.package!=='com.mintatolong.apktest') throw new Error('Application ID bukan identitas APK terpisah'); if(c.name!=='Minta Tolong Uji') throw new Error('Nama APK uji tidak sesuai'); console.log(c.name, c.android.package)"

      - name: Pasang EAS CLI
        run: npm install -g eas-cli

      - name: Bangun APK Android
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Unduh dan verifikasi APK
        run: |
          set -e
          URL=$(node -e "const r=require('./build-result.json'); console.log(Array.isArray(r) ? r[0].artifacts.buildUrl : r.artifacts.buildUrl)")
          curl -fL "$URL" -o minta-tolong-uji.apk
          test -s minta-tolong-uji.apk
          unzip -tq minta-tolong-uji.apk
          unzip -Z1 minta-tolong-uji.apk | grep -qx 'AndroidManifest.xml'
          unzip -Z1 minta-tolong-uji.apk | grep -Eq '^classes([0-9]+)?\.dex$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs minta-tolong-uji.apk
          sha256sum minta-tolong-uji.apk | tee apk-sha256.txt
          du -h minta-tolong-uji.apk

      - name: Buat ZIP cadangan sumber
        run: |
          set -e
          zip -qr minta-tolong-sumber-cadangan.zip . \
            -x '.git/*' 'node_modules/*' '.expo/*' 'android/.gradle/*' \
               'ios/Pods/*' 'minta-tolong-uji.apk' 'build-result.json' \
               'minta-tolong-sumber-cadangan.zip'
          unzip -tq minta-tolong-sumber-cadangan.zip
          sha256sum minta-tolong-sumber-cadangan.zip | tee source-zip-sha256.txt
          du -h minta-tolong-sumber-cadangan.zip

      - name: Simpan APK dan ZIP cadangan
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-uji-apk-dan-cadangan
          path: |
            minta-tolong-uji.apk
            minta-tolong-sumber-cadangan.zip
            apk-sha256.txt
            source-zip-sha256.txt
          if-no-files-found: error
          retention-days: 30
