name: Build APK Minta Tolong

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa kecocokan dependensi Expo
        run: npx expo install --check

      - name: Periksa kode aplikasi
        run: npx expo export --platform android

      - name: Pasang EAS CLI
        run: npm install -g eas-cli

      - name: Bangun APK Android
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Unduh APK
        run: |
          URL=$(node -e "const r=require('./build-result.json'); console.log(Array.isArray(r) ? r[0].artifacts.buildUrl : r.artifacts.buildUrl)")
          curl -fL "$URL" -o minta-tolong.apk

      
      - name: Periksa keutuhan APK dan tanda tangan
        run: |
          set -e
          test -s minta-tolong.apk
          unzip -tq minta-tolong.apk
          unzip -Z1 minta-tolong.apk | grep -qx 'AndroidManifest.xml'
          unzip -Z1 minta-tolong.apk | grep -Eq '^classes([0-9]+)?\.dex$'

          echo "Ukuran APK:"
          du -h minta-tolong.apk

          echo "SHA-256:"
          sha256sum minta-tolong.apk

          echo "Memeriksa tanda tangan APK..."
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs minta-tolong.apk


      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: minta-tolong-apk
          path: minta-tolong.apk
          if-no-files-found: error
          retention-days: 7
