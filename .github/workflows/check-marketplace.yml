name: Pemeriksaan kode marketplace
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/check-marketplace.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pasang dependensi
        run: npm ci
      - name: Periksa konfigurasi Expo
        run: npx expo config --type public
      - name: Uji bundel Android
        run: npx expo export --platform android --output-dir /tmp/minta-tolong-export
